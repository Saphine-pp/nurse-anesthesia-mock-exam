<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบ Volatile — ขั้นสูง (Set 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFF5;--panel:#FFFFFF;--ink:#1B2138;--muted:#5B6480;--line:#D4D9E6;
    --indigo:#3A4A9E;--indigo-soft:#E4E8F6;--signal:#1F9D63;--signal-soft:#E4F4EC;
    --alert:#C4463A;--alert-soft:#F8E7E5;--ink-panel:#141931;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px 80px;}

  header.hero{background:var(--ink-panel);color:#E9ECF8;padding:26px 18px 22px;position:relative;overflow:hidden;}
  .hero-inner{max-width:820px;margin:0 auto;position:relative;z-index:2;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8FA3E0;margin:0 0 8px;}
  .hero h1{font-size:26px;font-weight:700;margin:0 0 6px;line-height:1.25;letter-spacing:-.01em;}
  .hero p{margin:0;color:#A6AEC9;font-size:14px;}
  .badge-hard{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    background:#242C52;color:#A9BAEC;border:1px solid #43508A;border-radius:6px;padding:3px 8px;margin-left:8px;vertical-align:middle;}
  .curve{position:absolute;left:0;right:0;bottom:0;height:52px;width:100%;z-index:1;opacity:.55;}

  .scorebar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 18px;}
  .scorebar .inner{max-width:820px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .readout{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);}
  .readout b{color:var(--indigo);font-weight:600;}
  .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;max-width:280px;}
  .bar span{display:block;height:100%;width:0;background:var(--indigo);transition:width .4s ease;}
  .reset{font-family:"IBM Plex Mono",monospace;font-size:12px;background:none;border:1px solid var(--line);
    color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;}
  .reset:hover{border-color:var(--indigo);color:var(--indigo);}

  .section-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 6px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
  .section-head .no{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--indigo);font-weight:600;}
  .section-head h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .section-note{font-size:13px;color:var(--muted);margin:6px 0 16px;}

  .q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;margin:0 0 14px;}
  .q-top{display:flex;gap:11px;align-items:flex-start;}
  .qno{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;background:var(--indigo-soft);color:var(--indigo);
    padding:3px 8px;border-radius:6px;flex:none;margin-top:2px;}
  .stem{font-size:15.5px;font-weight:500;}
  .opts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    cursor:pointer;font-size:14.5px;background:#fff;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:var(--indigo);background:#FAFBFE;}
  .opt .k{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--muted);flex:none;}
  .opt.correct{background:var(--signal-soft);border-color:var(--signal);}
  .opt.correct .k{color:var(--signal);}
  .opt.wrong{background:var(--alert-soft);border-color:var(--alert);}
  .opt.wrong .k{color:var(--alert);}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.55;}

  .explain{margin-top:12px;border-left:3px solid var(--indigo);background:#F6F8FD;border-radius:0 8px 8px 0;
    padding:11px 13px;font-size:14px;color:#2B324C;display:none;}
  .explain.show{display:block;}
  .explain .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--indigo);display:block;margin-bottom:4px;}
  .explain b{color:var(--ink);}

  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:12.5px;}
  footer .mono{font-size:11px;letter-spacing:.1em;}

  .namecard{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .namecard label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 8px;}
  .namecard input{width:100%;font-family:"IBM Plex Sans Thai",sans-serif;font-size:15px;
    padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
  .namecard input:focus{outline:none;border-color:var(--ink);}
  .submitstatus{margin-top:10px;font-size:13px;min-height:18px;text-align:center;}
  .submitstatus.ok{color:var(--signal);}
  .submitstatus.err{color:var(--alert);}

  @media print{
    .scorebar,.reset,.curve,.namecard,.submitstatus{display:none!important;}
    body{background:#fff;}
    header.hero{background:#fff;color:#000;border-bottom:2px solid #000;}
    .eyebrow{color:#000;}.hero p{color:#333;}.badge-hard{color:#000;border-color:#000;background:#eee;}
    .explain{display:block!important;}
    .opt.correct{outline:2px solid var(--signal);}
    .q{break-inside:avoid;}
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Board Prep · Volatile Set 2</p>
    <h1>ข้อสอบ Volatile Anesthetics — ขั้นสูง<span class="badge-hard">ADVANCED</span></h1>
    <p>20 ข้อ · ตัวเลือกสมมาตร ไม่ใบ้คำตอบ · แตะเพื่อดูเฉลยและคำอธิบาย</p>
  </div>
  <svg class="curve" viewBox="0 0 820 52" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,48 C90,48 110,14 200,12 C300,10 330,34 430,38 C520,42 560,20 650,18 C730,16 760,32 820,34"
      fill="none" stroke="#8FA3E0" stroke-width="2"/>
  </svg>
</header>

<div class="wrap">
  <div class="namecard">
    <label for="takerName">ชื่อ–นามสกุล ของผู้ทำ (ไม่บังคับ)</label>
    <input id="takerName" type="text" placeholder="กรอกชื่อก่อนเริ่มทำข้อสอบ หากอยากให้ปรากฏใน Dashboard" maxlength="60" autocomplete="name">
  </div>
</div>

<div class="scorebar">
  <div class="inner">
    <span class="readout">SCORE <b id="score">0</b>/<span id="answered">0</span> · <span id="total">20</span> ข้อ</span>
    <div class="bar"><span id="fill"></span></div>
    <button class="reset" onclick="resetQuiz()">รีเซ็ต</button>
  </div>
</div>

<main class="wrap" id="quiz"></main>
<div class="wrap"><div id="submitStatus" class="submitstatus"></div></div>

<footer class="wrap">
  <p>ข้อสอบต้นฉบับระดับขั้นสูง เรียบเรียงแนวจากคลังข้อสอบเก่าในโปรเจกต์ — ใช้เพื่อฝึกทบทวนเท่านั้น</p>
  <p class="mono">VOLATILE · ADVANCED SET · v1</p>
</footer>

let answered=0, correct=0, totalQ=0;
let autoSubmitted=false, leftReported=false;
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyxjS3qR58huJqWwbMRpiiTSFuLD40JKzTNV0JdwQS99D_tuw9OmWbaihlfOvjCAIU/exec";
const QUIZ_NAME = "Volatile ขั้นสูง (20 ข้อ)";
const KEYS=["ก","ข","ค","ง"];
const quiz=document.getElementById("quiz");

DATA.forEach((sec,si)=>{
  const head=document.createElement("div");
  head.className="section-head";
  head.innerHTML=`<span class="no">0${si+1}</span><h2>${sec.sec}</h2>`;
  quiz.appendChild(head);
  const note=document.createElement("p");
  note.className="section-note";note.textContent=sec.note;
  quiz.appendChild(note);

  sec.qs.forEach((q)=>{
    totalQ++;
    const n=totalQ;
    const card=document.createElement("div");
    card.className="q";
    card.innerHTML=`
      <div class="q-top"><span class="qno">Q${n}</span><div class="stem">${q.stem}</div></div>
      <ul class="opts" data-ans="${q.ans}"></ul>
      <div class="explain"><span class="tag">เฉลย · คำอธิบาย</span><div class="etext"></div></div>`;
    const ul=card.querySelector(".opts");
    q.opts.forEach((o,oi)=>{
      const li=document.createElement("li");
      li.className="opt";
      li.innerHTML=`<span class="k">${KEYS[oi]}.</span><span>${o}</span>`;
      li.addEventListener("click",()=>choose(card,ul,oi,q));
      ul.appendChild(li);
    });
    card.querySelector(".etext").innerHTML=q.exp;
    quiz.appendChild(card);
  });
});
document.getElementById("total").textContent=totalQ;

function choose(card,ul,oi,q){
  if(ul.dataset.done)return;
  ul.dataset.done="1";
  [...ul.children].forEach((li,i)=>{
    li.classList.add("locked");
    if(i===q.ans)li.classList.add("correct");
    else if(i===oi)li.classList.add("wrong");
    else li.classList.add("dim");
  });
  card.querySelector(".explain").classList.add("show");
  answered++;
  if(oi===q.ans)correct++;
  updateScore();
}
function updateScore(){
  document.getElementById("score").textContent=correct;
  document.getElementById("answered").textContent=answered;
  document.getElementById("fill").style.width=(answered/totalQ*100)+"%";
  if(answered===totalQ && !autoSubmitted){
    autoSubmitted=true;
    submitScore();
  }
}
function setStatus(msg,cls){
  const el=document.getElementById("submitStatus");
  if(!el) return;
  el.textContent=msg; el.className="submitstatus"+(cls?(" "+cls):"");
}
function buildPayload(){
  return {
    name:(document.getElementById("takerName").value||"").trim(),
    score:correct, total:totalQ, answered:answered,
    set:QUIZ_NAME,
    status: answered===totalQ ? "ครบ" : "ไม่ครบ"
  };
}
function submitScore(retry){
  if(!SUBMIT_URL || SUBMIT_URL.indexOf("PASTE_")===0) return;
  const p=buildPayload();
  setStatus("กำลังส่งคะแนน…");
  fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(p)})
  .then(()=>{ setStatus("ส่งคะแนนเรียบร้อยแล้ว ✓","ok"); })
  .catch(()=>{
    if(!retry){ setTimeout(()=>submitScore(true),1500); return; }
    setStatus("ส่งคะแนนอัตโนมัติไม่สำเร็จ","err");
  });
}
function reportAbandon(){
  if(autoSubmitted || leftReported || answered===0) return;
  if(!SUBMIT_URL || SUBMIT_URL.indexOf("PASTE_")===0) return;
  leftReported=true;
  const p=buildPayload();
  try{ navigator.sendBeacon(SUBMIT_URL, JSON.stringify(p)); }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") reportAbandon(); });
window.addEventListener("pagehide", reportAbandon);
function resetQuiz(){
  answered=0;correct=0;autoSubmitted=false;leftReported=false;
  document.querySelectorAll(".opts").forEach(ul=>{delete ul.dataset.done;[...ul.children].forEach(li=>li.className="opt");});
  document.querySelectorAll(".explain").forEach(e=>e.classList.remove("show"));
  setStatus("");
  updateScore();
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
